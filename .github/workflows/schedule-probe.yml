name: Schedule Probe

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record trigger
        run: |
          echo "event=${{ github.event_name }}"
          echo "scheduled_at=${{ github.event.schedule }}"
          date -u +"utc_now=%Y-%m-%dT%H:%M:%SZ"